<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"
      defer
    ></script>
    <script src="./js/fslightbox.js" type="module"></script>
    <script src="./js/index.js" type="module"></script>
    <title>Document</title>
  </head>
  <body class="page__body">
    <div class="top-bar">
      <div class="top-bar__container container">
        <div class="top-bar__wrapper-text">
          <p class="top-bar__text">
            Зарегистрируйтесь и получите скидку 20% на первую покупку.
          </p>
          <a href="#" class="top-bar__link">Зарегистрироваться сейчас</a>
        </div>

        <button id="top-bar-close" class="top-bar__button">
          <svg class="top-bar__svg" width="20" height="20">
            <use class="top-bar__icon" href="./icons/close-icon.svg"></use>
          </svg>
        </button>
      </div>
    </div>

    <header class="header">
      <div class="container header__container">
        <button
          class="header__burger burger"
          aria-label="Открыть меню"
          aria-expanded="false"
          aria-controls="header__menu"
        >
          <svg width="24" height="24">
            <use
              class="burger__icon-menu"
              href="./icons/burger-sprite.svg#menu-burger"
            ></use>

            <use
              class="burger__icon-cross"
              href="./icons/sprite.svg#cross"
            ></use>
          </svg>
        </button>

        <a href="#" class="logo header__logo">
          <img
            width="160"
            height="22"
            class="logo-img"
            src="./icons/logo.svg"
            alt="Логотип SHOP.CO"
          />
        </a>

        <nav class="menu header__menu">
          <ul class="menu__list">
            <li class="menu__item">
              <button class="menu__button header__link text-regular">
                Магазин
                <svg width="16" height="16" class="header__icon menu__icon">
                  <use href="./icons/menu-sprite.svg#bottom-arrow"></use>
                </svg>
              </button>
            </li>

            <li class="menu__item">
              <a href="#" class="menu__link text-regular">Скидки</a>
            </li>

            <li class="menu__item">
              <a href="#" class="menu__link text-regular">Новые поступления</a>
            </li>

            <li class="menu__item">
              <a href="#" class="menu__link text-regular">Бренды</a>
            </li>
          </ul>
        </nav>

        <search class="search header__search" role="search">
          <form class="search__form" role="search" method="get" action="/search">
            <input
              class="search__icon"
              type="search"
              id="site-search"
              name="q"
              placeholder="Искать товары..."
              autocomplete="off"
              aria-label="Поиск товара"
            />
          </form>
        </search>

        <div class="header__user-actions">

          <button class="header__user-button header__visible" href="#">
            <svg width="24" height="24">
              <use
                class="header__icon"
                href="./icons/menu-sprite.svg#search"
              ></use>
            </svg>
          </button>

          <button class="header__user-button" href="#">
            <svg width="24" height="24">
              <use
                class="header__icon"
                href="./icons/menu-sprite.svg#cart"
              ></use>
            </svg>
          </button>

          <button class="header__user-button" href="#">
            <svg width="24" height="24">
              <use
                class="header__icon"
                href="./icons/menu-sprite.svg#profile"
              ></use>
            </svg>
          </button>

        </div>
      </div>
    </header>
  </body>
</html>
